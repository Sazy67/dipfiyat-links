<title>Dip Fiyat — Amazon Firsatlari</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #ff4b00, #ff8c00);
    color: #fff;
    padding: 24px 16px;
    text-align: center;
  }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
  header p  { font-size: .9rem; opacity: .85; margin-top: 6px; }
  .container { max-width: 640px; margin: 0 auto; padding: 20px 16px; }
  .updated { text-align: center; font-size: .75rem; color: #aaa; margin-bottom: 16px; }
  .deal-card {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 14px;
    margin-bottom: 14px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    text-decoration: none;
    color: inherit;
    gap: 14px;
    transition: transform .15s, box-shadow .15s;
  }
  .deal-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .deal-img {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .deal-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .deal-info { flex: 1; min-width: 0; }
  .deal-title {
    font-size: .88rem;
    font-weight: 600;
    color: #222;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .deal-price { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .old-price  { font-size: .78rem; color: #aaa; text-decoration: line-through; }
  .new-price  { font-size: 1.1rem; font-weight: 800; color: #00a844; }
  .badge {
    background: #ff4b00; color: #fff;
    font-size: .7rem; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
  }
  .deal-cta {
    background: #ff4b00;
    color: #fff;
    font-size: .78rem;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  footer {
    text-align: center;
    padding: 24px;
    font-size: .75rem;
    color: #bbb;
  }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #bbb;
    font-size: 1rem;
  }
</style>
</head>
<body>

<header>

</header>

            <div class="deal-img">

            </div>

                <div class="deal-title">QCY H3 Pro Hybrid Anc Hi-res Ldac Bluetooth 5.4 Kafaüstü Kablosuz Kula</div>

                    <span class="new-price">1.799 TL</span>

</div>

</html>
